
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event KeyCodes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #212121;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            background-color: #f1f1f1;
        }

        nav a {
            padding: 10px 25px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: white;
            color: black;
            text-decoration: none;
        }

        .project {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 80vh;
            flex-direction: column;
        }

        .insert {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        table, th, td {
            border: 1px solid #e7e7e7;
            border-collapse: collapse;
            padding: 10px;
        }

        .color {
            color: aliceblue;
            display: flex;
            flex-direction: row;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="https://www.youtube.com/" target="_blank">
            Youtube channel
        </a>
    </nav>

    <div class="project">
        <div id="insert">
            <div class="key">
                Press the key and watch magic
            </div>
        </div>
    </div>

    <script>

    const insert=document.querySelector('#insert');
    window.addEventListener('keydown', (e)=>{
        insert.innerHTML=`
        <div class='color'>
            <table>
                <tr>
                    <th>Key</th>
                    <th>KeyCode</th>
                    <th>Code</th>
                </tr>
                <tr>
                    <td>${e.key}</td>
                    <td>${e.keyCode}</td>
                    <td>${e.code}</td>
                </tr>
            </table>
        </div>
             `
            })


    </script>
</body>
</html>
