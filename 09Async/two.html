<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai & Code</title>
</head>
<body>
    <h1>Prateek</h1>
    <button id="start">START</button>
    <button id="stop">STOP</button>
</body>

<script>

    // Task is to start and say name with date and time as soon as START Button is clicked and should stop as soon as STOP Button is invoked !!

    let sayNameDate; // It Will be accessible to both the Event-Listeners..... (In-Scope to both)

    document.querySelector('#start').addEventListener('click', function(){
        if(!sayNameDate){ // It Ensures that Only One Interval should start at a Time, No Multiple Intervals
            sayNameDate=setInterval(function(){
            console.log("Prateek is calling at: ",Date.now());
            },1000) 
        }
    })

    document.querySelector('#stop').addEventListener('click', function(){
        clearInterval(sayNameDate);
        sayNameDate=null;
    })

</script>
</html>
