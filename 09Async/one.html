<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Prateek</h1>
    <button id="stop">STOP</button>
</body>

<script>

// ------- Usage of SetTimeout ----------

const SayPrateek=function(){
    console.log("Hi, I am Prateek this side !!")
}
setTimeout(SayPrateek,4000)


const changeText=function(){
    document.querySelector('h1').innerHTML="Best JS Course Here !!";
}
const changeMe=setTimeout(changeText,12000)

document.querySelector('#stop').addEventListener('click', function(){
    clearTimeout(changeMe);
    console.log("STOPPED !!")
})

</script>

</html>
