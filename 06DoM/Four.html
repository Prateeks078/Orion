<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final DOM</title>
</head>
<body style="background-color: black; color: green;">
    <ul class="language">
        <li>Javascript</li>
        <li>C++</li>
        <li>Rust</li>
        <li>Ruby</li>
    </ul>
</body>
<script>
        function addLanguage(langName){
           const li=document.createElement('li');
           li.innerText=`${langName}`;

           const Lang=document.querySelector('.language');
           Lang.appendChild(li);
        }

        function addOptiLanguage(langName){
            const li=document.createElement('li');
            li.appendChild(document.createTextNode(langName));
            document.querySelector('.language').appendChild(li);
        }

        addLanguage("Python");
        addLanguage("Csharp");
        addLanguage("TypeScript"); // --> Learn about this Naive Function first of all 

        addOptiLanguage("Java"); // --> Learn about this function as well


        // Editing the current ELEMENT 
        const secondLang=document.querySelector("li:nth-child(2)");
        secondLang.innerText="Prateek";
        
        // U cant use here create Text Node and append because that will append
        // If u really wanna use it so try using it with .replaceChild(...,...) thing and all

        // Removing the Child from DOM
        const LastChild=document.querySelector("li:last-child");
        LastChild.remove();        
</script>
</html>
